<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Nocturne Seed Bank</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Nocturne Seed Bank home">
      <span class="brand-mark"></span>
      Nocturne Seed Bank
    </a>
    <nav aria-label=\"Primary navigation\">
      <a href=\"index.html#collection\">Collection</a>
      <a href=\"gallery.html\">Shop</a>
      <a href=\"cart.html\">Cart</a>
    </nav>
  </header>

  <main class="shop-page">
    <section class="shop-panel">
      <p class="eyebrow">Specimen shop</p>
      <h1>Purchase seeds from the archive.</h1>
      <p class="lede">Each tray contains a specimen ready to bloom in your nocturnal garden. Select a seed and add it to your order.</p>
      <div id="products-grid" class="products-grid"></div>
      <a class="button primary" href="cart.html">View cart</a>
      <a class="button ghost" href="index.html">Back to the archive</a>
    </section>
  </main>

  <script src="cart.js"></script>
  <script>
    function renderProducts() {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = PRODUCTS.map(product => `
        <article class="product-card product-card--${product.id % 3}">
          <h2>${product.name}</h2>
          <p>${product.description}</p>
          <dl>
            <div>
              <dt>Glow</dt>
              <dd>${product.glow}</dd>
            </div>
            <div>
              <dt>Scent</dt>
              <dd>${product.scent}</dd>
            </div>
            <div>
              <dt>Soil</dt>
              <dd>${product.soil}</dd>
            </div>
          </dl>
          <div class="product-footer">
            <span class="product-price">$${product.price.toFixed(2)}</span>
            <button class="button primary" onclick="addToCart(${product.id}); alert('Added to cart!');">Add to cart</button>
          </div>
        </article>
      `).join('');
    }

    renderProducts();
  </script>
</body>
</html>
